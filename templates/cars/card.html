<div class="card h-100 shadow-sm">{% if car.primary_image %}<img src="{{ car.primary_image.image.url }}" class="card-img-top car-thumb">{% else %}<div class="placeholder">No image</div>{% endif %}
<div class="card-body"><div class="small text-muted">{{ car.stock_number }}</div><h5>{{ car.year }} {{ car.make }} {{ car.model }}</h5><p class="mb-1">{{ car.mileage|floatformat:0 }} km · {{ car.transmission }} · {{ car.fuel_type }}</p><h5>{{ car.currency }} {{ car.price|floatformat:2 }}</h5><a class="btn btn-primary" href="{{ car.get_absolute_url }}">View car</a></div></div>
