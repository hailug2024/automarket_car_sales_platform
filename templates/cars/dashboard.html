{% extends "base.html" %}{% block content %}<h1>My Dashboard</h1><h3 class="mt-4">My purchases</h3><table class="table"><tr><th>Reference</th><th>Vehicle</th><th>Amount</th><th>Payment</th><th>Status</th></tr>{% for s in sales %}<tr><td>{{ s.reference }}</td><td>{{ s.vehicle }}</td><td>{{ s.amount }}</td><td>{{ s.payment_status }}</td><td>{{ s.status }}</td></tr>{% empty %}<tr><td colspan="5">No purchases yet.</td></tr>{% endfor %}</table>{% endblock %}
