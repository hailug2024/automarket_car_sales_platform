<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}AutoMarket{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/static/css/site.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
<div class="container"><a class="navbar-brand fw-bold" href="/">AutoMarket</a>
<div class="navbar-nav ms-auto">
<a class="nav-link" href="/">Cars</a><a class="nav-link" href="/reports/">Reports</a>
{% if user.is_authenticated %}<a class="nav-link" href="/dashboard/">My Dashboard</a>{% endif %}
<a class="nav-link" href="/admin/">Admin</a>
</div></div></nav>
<main class="container py-4">
{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
<footer class="bg-dark text-white p-4 mt-5"><div class="container">AutoMarket Car Sales Platform</div></footer>
</body></html>
